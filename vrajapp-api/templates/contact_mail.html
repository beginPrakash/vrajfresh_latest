<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        .container {
            width: 600px;
            margin: auto;
            font-family: Arial, Helvetica, sans-serif;
        }

        .heading {
            background-color: #1e53a5;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            border-radius: 6px 6px 0 0;
        }

        .box_container {
            border: 1px solid #e6e6e6;
            padding: 20px 30px;
        }

        .contain_color {
            color: rgb(61, 61, 61);
            font-size: 16px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            font-size: 15px;
        }

        table,
        td,
        th {
            border: 1px solid #ccc;
        }

        td,
        th {
            padding: 10px;
            text-align: left;
        }

        th {
            background: #f9f9f9;
            font-weight: bold;
        }

        a {
            color: #1e53a5;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="heading">
            <h1>Thank You for Contacting Us!</h1>
        </div>

        <div class="box_container">
            <p class="contain_color">Hi ##first_name## ##last_name##,</p>
            <p class="contain_color">Thank you for reaching out. We have received your message and will get back to you soon.</p>

            <!-- Contact Details Table -->
            <table>
                <tr>
                    <th>Contact Us</th>
                    <th>Details</th>
                </tr>
                <tr>
                    <td>Phone</td>
                    <td>##phone##</td>
                </tr>
                <tr>
                    <td>Message</td>
                    <td>##message##</td>
                </tr>
            </table>

            <br>
            <p class="contain_color">Thanks for using <a href="https://www.vrajfresh.com">Vraj Fresh</a>!</p>
        </div>
    </div>
</body>

</html>
